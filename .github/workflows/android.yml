name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unit tests (the maths)
        run: node --test tests/engine.test.js

      - name: Install
        run: npm install

      - name: Fonts (optional, the app falls back to the system font)
        run: node tools/fetch-fonts.mjs || true

      - name: Create the Android project and add Screens Time code
        run: node tools/setup-android.mjs

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk screens-time.apk

      - uses: actions/upload-artifact@v4
        with:
          name: screens-time-apk
          path: screens-time.apk

      - name: Publish a download link (Releases -> latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest screens-time.apk \
            --title "Screens Time (latest build)" \
            --notes "Debug-signed APK built from commit ${GITHUB_SHA::7}. Install it on an Android phone: see docs/ANDROID.md." \
            --target "$GITHUB_SHA"
